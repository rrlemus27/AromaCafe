<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos - AromaCafe</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #FBF7F2; color: #333; }
        h1 { color: #5B3A29; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #5B3A29; color: white; }
        tr:nth-child(even) { background: #EADDD0; }
        a.btn { background: #B45309; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; }
        a.link { color: #B45309; text-decoration: none; margin-right: 8px; }
    </style>
</head>
<body>
    <h1>Productos</h1>
    <p><a class="btn" th:href="@{/productos/nuevo}">+ Nuevo producto</a></p>
    <table>
        <thead>
            <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Disponible</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.idProducto}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.categoria}"></td>
                <td th:text="${p.precio}"></td>
                <td th:text="${p.disponible} ? 'Sí' : 'No'"></td>
                <td>
                    <a class="link" th:href="@{/productos/editar/{id}(id=${p.idProducto})}">Editar</a>
                    <a class="link" th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}"
                       onclick="return confirm('¿Eliminar este producto?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
