<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente - AromaCafe</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #FBF7F2; color: #333; }
        h1 { color: #5B3A29; }
        form { background: white; padding: 20px; border-radius: 6px; max-width: 400px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { background: #B45309; color: white; padding: 10px 16px; border: none; border-radius: 4px; margin-top: 16px; cursor: pointer; }
        a { color: #B45309; }
    </style>
</head>
<body>
    <h1 th:text="${cliente.idCliente} == 0 ? 'Nuevo cliente' : 'Editar cliente'"></h1>
    <form th:action="${cliente.idCliente} == 0 ? @{/clientes/guardar} : @{/clientes/actualizar/{id}(id=${cliente.idCliente})}"
          method="post" th:object="${cliente}">
        <label>Nombre</label>
        <input type="text" th:field="*{nombre}" required>
        <label>Teléfono</label>
        <input type="text" th:field="*{telefono}">
        <label>Correo</label>
        <input type="email" th:field="*{correo}">
        <label>Dirección</label>
        <input type="text" th:field="*{direccion}">
        <button type="submit">Guardar</button>
    </form>
    <p><a th:href="@{/clientes}">← Volver</a></p>
</body>
</html>
