<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos - AromaCafe</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #FBF7F2; color: #333; }
        h1 { color: #5B3A29; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #5B3A29; color: white; }
        tr:nth-child(even) { background: #EADDD0; }
        a.btn { background: #B45309; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; }
        a.link { color: #B45309; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Pedidos</h1>
    <p><a class="btn" th:href="@{/pedidos/nuevo}">+ Nuevo pedido</a>
       &nbsp; <a class="link" th:href="@{/}">← Inicio</a></p>
    <table>
        <thead>
            <tr><th>ID</th><th>Tipo</th><th>Estado</th><th>Total</th></tr>
        </thead>
        <tbody>
            <tr th:each="p : ${pedidos}">
                <td th:text="${p.idPedido}"></td>
                <td th:text="${p.tipo}"></td>
                <td th:text="${p.estado}"></td>
                <td th:text="${p.total}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
